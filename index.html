<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anderson Rodrigues · Em breve</title>
  <meta name="description" content="Nosso novo site está em desenvolvimento. Em breve, novidades.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f3ee;
      --text: #1d1b18;
      --muted: #6b655c;
      --accent: #a8793f;
      --line: #e2dcd2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141311;
        --text: #f2eee8;
        --muted: #a39d93;
        --accent: #d1a467;
        --line: #2c2a26;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 560px;
      text-align: center;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(40px, 9vw, 64px);
      line-height: 1.05;
      letter-spacing: -.02em;
      margin: 28px 0 18px;
    }
    p {
      font-size: 17px;
      line-height: 1.6;
      color: var(--muted);
    }
    .line {
      width: 48px;
      height: 1px;
      background: var(--accent);
      margin: 36px auto 0;
    }
    footer {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <span class="tag"><span class="dot"></span>Site em desenvolvimento</span>
    <h1>Anderson Rodrigues</h1>
    <p>Estamos preparando um novo site com todo o cuidado.<br>Em breve, ele estará no ar.</p>
    <div class="line"></div>
    <footer>&copy; <span id="y">2026</span> Anderson Rodrigues</footer>
  </main>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
